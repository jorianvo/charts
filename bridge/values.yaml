hospitalName: ""
# Name shown in the UIs, e.g. "Hospital A (Talos)". Defaults to hospitalName
# in title case ("hospital-a" becomes "Hospital A").
hospitalDisplayName: ""

mode: gateway

centralBridge: "http://bridge-central"

tailnetDomain: ""

ingress:
  enabled: true

image:
  repository: jorianvo/bridge
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
