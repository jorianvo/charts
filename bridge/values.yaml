hospitalName: ""
# Name shown in the UIs, e.g. "Hospital A (Talos)". Defaults to hospitalName
# in title case ("hospital-a" becomes "Hospital A").
hospitalDisplayName: ""

mode: gateway

centralBridge: "http://bridge-central"

# Central mode: the hospitals in the network, e.g. [hospital-a, hospital-b].
# Each one is drawn with its on-prem Talos cluster, even before anything is
# deployed on it, so the overview shows which hospitals are not connected yet.
hospitals: []

image:
  repository: jorianvo/bridge
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
