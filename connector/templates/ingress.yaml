{{- if .Values.ingress.enabled -}}
{{- $hostname := printf "%s.%s" (required "hospitalName is required" .Values.hospitalName) (required "tailnetDomain is required" .Values.tailnetDomain) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "connector.fullname" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
  annotations:
    tailscale.com/tags: {{ printf "tag:%s" .Values.hospitalName | quote }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "connector.fullname" . }}
      port:
        name: http
  tls:
    - hosts:
        - {{ $hostname | quote }}
{{- end }}
